name: Deploy (GitHub Pages)

# Publica a aplicação em https://<usuário>.github.io/<repositório>/.
# É preciso habilitar uma vez: Settings → Pages → Source: GitHub Actions.
#
# O build assume o subcaminho do repositório (VITE_BASE), que é o que o Pages
# serve. `npm run smoke` confere, antes de publicar, que a aplicação funciona
# desse caminho — asset, service worker dos mocks e link direto.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build para o subcaminho do repositório
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - run: npx playwright install --with-deps chromium

      - name: Fumaça sobre o build publicado
        run: npm run smoke
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
