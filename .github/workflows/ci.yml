name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint, formato e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npx prettier --check .

      - name: Testes de unidade
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      # A suíte sobe o build de produção sozinha (webServer no playwright.config).
      # As baselines visuais são geradas em Linux, que é o runner aqui — comparar
      # com outro sistema operacional daria diferença de antialiasing.
      - name: Testes E2E e regressão visual
        run: npm run test:e2e

      - name: Fumaça sobre o build publicado
        run: npm run smoke

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
