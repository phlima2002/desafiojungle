name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint, formato e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npx prettier --check .

      - name: Testes de unidade
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      # A suíte sobe o build de produção sozinha (webServer no playwright.config).
      #
      # `--ignore-snapshots` desliga só a comparação de pixels. As baselines são
      # geradas na máquina de desenvolvimento, e mesmo entre dois Linux a
      # renderização de texto difere o bastante para a comparação acusar uma
      # mudança que não existe — o runner do GitHub tem outra pilha de fontes.
      # Comparar contra baselines de outra máquina só produz falso positivo, que
      # é pior do que não comparar: ensina a ignorar o vermelho.
      #
      # A regressão visual continua sendo parte da entrega e roda localmente com
      # `npm run test:e2e`; aqui ficam os 142 testes de comportamento, que é o
      # que um runner consegue verificar com honestidade.
      - name: Testes E2E
        run: npm run test:e2e -- --ignore-snapshots

      - name: Fumaça sobre o build publicado
        run: npm run smoke

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
